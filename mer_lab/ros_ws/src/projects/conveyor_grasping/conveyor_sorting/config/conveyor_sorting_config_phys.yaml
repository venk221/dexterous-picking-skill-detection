conveyor_sorting:
  topographical_map:
    raw_depth_topic: "/camera/depth/image_rect_raw"
    input_depth_topic: "/depth_translator/image" # UPDATED
    input_color_topic: "/camera/color/image_raw"      # UPDATED
    input_color_encoding: "rgb8"
    topographical_map_topic: "/conveyor_sorting/topographical_map"
    camera_table_offset: 0.735       # UPDATED
    division_count: 10              # How many level curves
    peak_distance: 0.175          # Height from the ground
    roi:
      top_left:
        x: 150
        y: 100
      bottom_right:
        x: 500
        y: 400
    score_topic: "/score"
    score_img_topic: "/scored_image"
    desired_color_range:
      min:
        h: 90
        s: 65
        v: 25
      max:
        h: 150
        s: 100
        v: 100
  table_desc:
    center:
      x: 0.688
      y: 0.0
      z: -0.01251
    size:
      x: 0.76
      y: 1.52
      z: 0.029
  pile_spawner:
    pile_width: 0.3
    pile_length: 0.3
    pile_height_diff: 0.1
    pile_items:
      min: 25
      max: 30
  sweeper:
    max_iter: 5
    use_ot: true     # Whether to use optimal transport or just random
    move: true
    seed: -1 # The seed to use when sampling, set it to -1 to make it random
    discrete_angles: 36
    sweep_topic: "execute_sweeping"
    camera_intrinsics_topic: "/camera/depth/camera_info"
    camera_frame: "camera_depth_optical_frame"
    world_frame: "world"
    ot_sweeper:
      samples: 100 # How many times to sample from the topographical map
      spread_area: 0.4  # The area within which we spread items around
  motion_planner:
    initial_joints:
      - 0.0
      - 0.0
      - 0.0
      - -1.5707
      - 0.0
      - 1.5707
      - 0.707
    execute: false
