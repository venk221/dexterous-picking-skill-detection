origami_vs:
  
  goal_pose_x: 450
  goal_pose_y: 300

  control_rate: 30

  lambda: 2

  init_max_length_hi: 0
  init_max_length_lo: 180
  init_min_length_hi: 0
  init_min_length_lo: 70

  trans_ee_marker_y: -25
  trans_ee_marker_z: 25
  trans_base_marker_y: 0
  trans_base_marker_z: -54

  origami_module_d: 40

  ratio_mm_pixel: 0.4

origami_adaptive_vs:
  goal_pose: [250, 300]
  lambda: 2
  control_rate: 15
  window_size: 200
  gamma: 1.0e-7
  epsilon: 1.0e-5
  update_threshold: 2
  init_jacobian: [.1,-.3,.7,-.11]    # initialize non-zero combined Jacobian
  saturation: 25

origami_skeleton_vs:
  lambda: 0.1
  num_of_segments: 2
  degree: 2
  no_of_features: 6
  no_of_actuators: 4
  no_of_modules: 2
  control_rate: 10
  gamma: 1.0e-7
  window_size: 50
  update_threshold: 5
  saturation: 25
  epsilon: 1.0e-5
  init_jacobian: [.1,-.3,.7,-.11, .13, .19,-.17, .23, .29,.37, -.31, .41]    # initialize non-zero combined Jacobian
